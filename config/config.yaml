assistant:
  name: "Джарвис"
  wake_word: "Куза"

logging:
  console_level: "INFO"
  file_level: "DEBUG"
  file: "logs/assistant.log"

llm:
  provider: "lmstudio"
  model: "qwen2.5-coder-7b-instruct"
  host: "http://localhost:1234/v1"
  temperature: 0.2
  max_tokens: 256

tts:
  piper_model: "ru_RU-dmitri-medium.onnx"

stt:
  whisper_model: "small"

audio:
  input_device_index: 5
  debug: false

wake_word:
  backend: "microwakeword"
  model: "assets/models/wake_word/kuza/kuza.json"
  cooldown_seconds: 1.5
  debug: false
