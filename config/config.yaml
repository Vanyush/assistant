assistant:
  name: "Джарвис"
  wake_word: "Джарвис"

llm:
  provider: "lmstudio"
  model: "qwen2.5-coder-7b-instruct"
  host: "http://localhost:1234/v1"
  temperature: 0.2
  max_tokens: 256

tts:
  piper_model: "ru_RU-dmitri-medium.onnx"

stt:
  whisper_model: "small"

wake_word:
  backend: "microwakeword"
  model: "assets/models/wake_word/ru_jarvis_mww.json"
  cooldown_seconds: 1.5
