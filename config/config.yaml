assistant:
  name: "Димас"
  wake_word: "слушай димас"

logging:
  console_level: "INFO"
  file_level: "INFO"
  # file_level: "DEBUG"
  file: "logs/assistant.log"

llm:
  provider: "lmstudio"
  model: "qwen2.5-coder-7b-instruct"
  host: "http://localhost:1234/v1"
  temperature: 0.2
  max_tokens: 256

tts:
  piper_model: "ru_RU-dmitri-medium.onnx"

stt:
  whisper_model: "small"

audio:
  input_device_index: null
  debug: false

wake_word:
  backend: "vosk"
  model: "assets/models/wake_word/vosk/vosk-model-small-ru-0.22"
  cooldown_seconds: 2.0

spotify:
  player: spotify
  command_timeout_seconds: 5.0
  my_music_playlist: "spotify:playlist:37i9dQZF1F5p3rmiWPIYgZ"
  default_shuffle: true

